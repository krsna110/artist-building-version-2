<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="promptBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111F"/>
      <stop offset="50%" stop-color="#191729"/>
      <stop offset="100%" stop-color="#0B0A14"/>
    </linearGradient>
    <linearGradient id="cardGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B3D"/>
      <stop offset="100%" stop-color="#140E24"/>
    </linearGradient>
    <linearGradient id="goldPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9255FF"/>
      <stop offset="50%" stop-color="#6227E6"/>
      <stop offset="100%" stop-color="#F4B942"/>
    </linearGradient>
    <linearGradient id="goldBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD580"/>
      <stop offset="100%" stop-color="#E5A52E"/>
    </linearGradient>
    <filter id="pDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#promptBgGrad)"/>

  <!-- Ambient Glowing Tech Clouds -->
  <circle cx="240" cy="140" r="160" fill="#9255FF" opacity="0.16" filter="url(#neonBlur)"/>
  <circle cx="360" cy="80" r="100" fill="#F4B942" opacity="0.09" filter="url(#neonBlur)"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="#3A2859" stroke-width="0.8" opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
    <line x1="0" y1="60" x2="480" y2="60"/>
    <line x1="0" y1="140" x2="480" y2="140"/>
    <line x1="0" y1="220" x2="480" y2="220"/>
    <line x1="0" y1="300" x2="480" y2="300"/>
  </g>

  <!-- Background Faded Card (Top Left) -->
  <g transform="translate(60, 30) rotate(-6)" opacity="0.6">
    <rect width="200" height="110" rx="12" fill="#191729" stroke="#4B3475" stroke-width="1"/>
    <rect x="14" y="14" width="70" height="12" rx="6" fill="#9255FF" opacity="0.4"/>
    <rect x="14" y="34" width="160" height="6" rx="3" fill="#6A5394" opacity="0.5"/>
    <rect x="14" y="46" width="130" height="6" rx="3" fill="#6A5394" opacity="0.4"/>
    <rect x="14" y="58" width="145" height="6" rx="3" fill="#6A5394" opacity="0.4"/>
    <rect x="14" y="76" width="50" height="18" rx="6" fill="#2E214A"/>
  </g>

  <!-- Background Faded Card (Top Right) -->
  <g transform="translate(280, 45) rotate(7)" opacity="0.5">
    <rect width="180" height="110" rx="12" fill="#191729" stroke="#4B3475" stroke-width="1"/>
    <circle cx="24" cy="24" r="8" fill="#F4B942" opacity="0.6"/>
    <rect x="40" y="20" width="80" height="8" rx="4" fill="#B69AFF" opacity="0.6"/>
    <rect x="20" y="44" width="140" height="6" rx="3" fill="#6A5394" opacity="0.5"/>
    <rect x="20" y="56" width="110" height="6" rx="3" fill="#6A5394" opacity="0.4"/>
  </g>

  <!-- Main Hero Prompt Card (Center) -->
  <g transform="translate(100, 75)" filter="url(#pDropShadow)">
    <!-- Card Base -->
    <rect width="280" height="195" rx="16" fill="url(#cardGlow1)" stroke="#9255FF" stroke-width="1.5"/>

    <!-- Gradient Edge Glow at Top -->
    <path d="M0 16 Q0 0 16 0 L264 0 Q280 0 280 16" fill="none" stroke="url(#goldPurple)" stroke-width="2.5"/>

    <!-- Window Header -->
    <g transform="translate(16, 14)">
      <circle cx="6" cy="6" r="4" fill="#FF5F56"/>
      <circle cx="20" cy="6" r="4" fill="#FFBD2E"/>
      <circle cx="34" cy="6" r="4" fill="#27C93F"/>
      <rect x="52" y="-1" width="130" height="14" rx="7" fill="#24183E"/>
      <text x="62" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#B69AFF" letter-spacing="0.3">prompt-generator.ai</text>
    </g>

    <!-- Code / Prompt Content Area -->
    <rect x="16" y="40" width="248" height="96" rx="10" fill="#0B0A14" stroke="#35235A" stroke-width="1"/>

    <!-- Badge inside Prompt -->
    <rect x="26" y="50" width="105" height="18" rx="9" fill="rgba(244, 185, 66, 0.15)" stroke="#F4B942" stroke-width="0.8"/>
    <text x="35" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#F4B942">✦ VIRAL REEL HOOK</text>

    <!-- Prompt Text Lines -->
    <text x="26" y="84" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="600" fill="#F5F3FA">
      "You are a master video editor.
    </text>
    <text x="26" y="99" font-family="'Plus Jakarta Sans', monospace" font-size="10.5" font-weight="500" fill="#B8B4C7">
      Analyze this footage &amp; craft 5 high-
    </text>
    <text x="26" y="114" font-family="'Plus Jakarta Sans', monospace" font-size="10.5" font-weight="500" fill="#B8B4C7">
      retention hooks with B-roll cues..."
    </text>

    <line x1="210" y1="102" x2="210" y2="116" stroke="#F4B942" stroke-width="2"/>

    <!-- Action Buttons Row -->
    <!-- "Explain" Button -->
    <g transform="translate(16, 148)">
      <rect width="82" height="32" rx="8" fill="#22173B" stroke="#793BFF" stroke-width="1.2"/>
      <text x="20" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Explain</text>
    </g>

    <!-- "Copy Prompt" Button -->
    <g transform="translate(106, 148)">
      <rect width="112" height="32" rx="8" fill="url(#goldBtn)"/>
      <path d="M18 10 L28 10 M18 16 L28 16 M18 22 L24 22" stroke="#17120A" stroke-width="1.5" stroke-linecap="round"/>
      <text x="30" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#17120A">Copy Prompt</text>
    </g>

    <!-- Sparkle Badge -->
    <g transform="translate(226, 148)">
      <rect width="38" height="32" rx="8" fill="#1C1333" stroke="#4D3678" stroke-width="1"/>
      <text x="12" y="21" font-size="14">✨</text>
    </g>
  </g>

</svg>
