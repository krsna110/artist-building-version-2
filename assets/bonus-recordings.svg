<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111F"/>
      <stop offset="50%" stop-color="#191729"/>
      <stop offset="100%" stop-color="#0B0A14"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#221B35"/>
      <stop offset="50%" stop-color="#2E2447"/>
      <stop offset="100%" stop-color="#191729"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#EDE6D4"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B69AFF"/>
      <stop offset="100%" stop-color="#9255FF"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD580"/>
      <stop offset="100%" stop-color="#E5A52E"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="320" fill="url(#bgGrad1)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="80" r="140" fill="#9255FF" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="380" cy="180" r="120" fill="#F4B942" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Desk Surface -->
  <path d="M0 190 L480 150 L480 320 L0 320 Z" fill="url(#deskGrad)" opacity="0.85"/>
  <line x1="0" y1="190" x2="480" y2="150" stroke="#9255FF" stroke-width="1.5" opacity="0.3"/>

  <!-- Coffee Cup / Studio Element -->
  <g transform="translate(380, 80)">
    <ellipse cx="25" cy="45" rx="30" ry="12" fill="#0B0A14" opacity="0.4"/>
    <circle cx="25" cy="30" r="22" fill="#191729" stroke="#3D2E55" stroke-width="2"/>
    <circle cx="25" cy="30" r="18" fill="#12111F"/>
    <circle cx="25" cy="30" r="14" fill="#3A1E0C"/>
    <!-- Steam -->
    <path d="M20 18 Q17 10 22 2" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M28 16 Q32 8 27 0" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Reading Glasses -->
  <g transform="translate(70, 110) rotate(-15)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#B69AFF" stroke-width="2" opacity="0.7"/>
    <circle cx="56" cy="20" r="16" fill="none" stroke="#B69AFF" stroke-width="2" opacity="0.7"/>
    <path d="M36 18 Q46 14 56 18" fill="none" stroke="#B69AFF" stroke-width="2" opacity="0.7"/>
    <line x1="4" y1="20" x2="-20" y2="30" stroke="#9255FF" stroke-width="2" opacity="0.5"/>
    <line x1="72" y1="20" x2="96" y2="30" stroke="#9255FF" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Open Spiral Notebook (The Centerpiece) -->
  <g transform="translate(130, 45) rotate(4)" filter="url(#cardShadow)">
    <!-- Base Notebook Pages Stack -->
    <rect x="-4" y="-4" width="228" height="238" rx="14" fill="#D6CDB8" opacity="0.6"/>
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#paperGrad)"/>

    <!-- Red Margin Line -->
    <line x1="36" y1="0" x2="36" y2="230" stroke="#FF6B6B" stroke-width="1.2" opacity="0.6"/>

    <!-- Notebook Horizontal Lines -->
    <line x1="0" y1="38" x2="220" y2="38" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="62" x2="220" y2="62" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="86" x2="220" y2="86" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="110" x2="220" y2="110" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="134" x2="220" y2="134" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="158" x2="220" y2="158" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="182" x2="220" y2="182" stroke="#D1C7B2" stroke-width="1"/>
    <line x1="0" y1="206" x2="220" y2="206" stroke="#D1C7B2" stroke-width="1"/>

    <!-- Spiral Wire Rings on Top/Side -->
    <g fill="#4A3B66" stroke="#1D1230" stroke-width="1">
      <ellipse cx="6" cy="24" rx="12" ry="4"/>
      <ellipse cx="6" cy="54" rx="12" ry="4"/>
      <ellipse cx="6" cy="84" rx="12" ry="4"/>
      <ellipse cx="6" cy="114" rx="12" ry="4"/>
      <ellipse cx="6" cy="144" rx="12" ry="4"/>
      <ellipse cx="6" cy="174" rx="12" ry="4"/>
      <ellipse cx="6" cy="204" rx="12" ry="4"/>
    </g>

    <!-- Notes Content (Handwritten Feel) -->
    <!-- Header Badge -->
    <rect x="46" y="14" width="150" height="18" rx="4" fill="#9255FF" opacity="0.15"/>
    <text x="52" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#6227E6" letter-spacing="0.5">CLASS NOTES &amp; RECORDINGS</text>

    <!-- Chapter 1 -->
    <circle cx="48" cy="50" r="4.5" fill="#793BFF"/>
    <text x="58" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1E1538">01. Cuts, Pacing &amp; J-Cuts</text>
    <path d="M190 48 L194 52 L202 44" fill="none" stroke="#F4B942" stroke-width="2" stroke-linecap="round"/>

    <!-- Chapter 2 -->
    <circle cx="48" cy="74" r="4.5" fill="#793BFF"/>
    <text x="58" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1E1538">02. Lumetri Color Curves</text>
    <path d="M190 72 L194 76 L202 68" fill="none" stroke="#F4B942" stroke-width="2" stroke-linecap="round"/>

    <!-- Chapter 3 -->
    <circle cx="48" cy="98" r="4.5" fill="#793BFF"/>
    <text x="58" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1E1538">03. Speed Ramp Keyframes</text>
    <path d="M190 96 L194 100 L202 92" fill="none" stroke="#F4B942" stroke-width="2" stroke-linecap="round"/>

    <!-- Audio Waveform Sketch -->
    <path d="M52 134 Q60 120 68 134 T84 134 T100 134 T116 134 T132 134 T148 134 T164 134 T180 134 T196 134" fill="none" stroke="#9255FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <text x="52" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#786E85">Audio Sync &amp; Beat Matching</text>

    <!-- Highlight Box -->
    <rect x="46" y="168" width="160" height="46" rx="6" fill="#F3EBFD" stroke="#CBB4F7" stroke-dasharray="3 3"/>
    <text x="54" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#4B19BD">⚡ Mentor Cheatsheet:</text>
    <text x="54" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#4B19BD">• 140+ Preset Shortcodes</text>
    <text x="54" y="209" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#4B19BD">• Direct 4K Download Links</text>
  </g>

  <!-- Luxury Stylus / Fountain Pen -->
  <g transform="translate(310, 160) rotate(-35)">
    <!-- Pen Shadow -->
    <rect x="2" y="8" width="130" height="10" rx="5" fill="#000" opacity="0.35"/>
    <!-- Pen Body -->
    <rect x="0" y="0" width="110" height="11" rx="4" fill="#0B0A14" stroke="#9255FF" stroke-width="1.2"/>
    <!-- Gold Accent Band -->
    <rect x="75" y="0" width="8" height="11" fill="url(#goldGlow)"/>
    <!-- Pen Grip -->
    <polygon points="110,1 130,5.5 110,10" fill="#B69AFF"/>
    <!-- Nib -->
    <polygon points="130,4 140,5.5 130,7" fill="#F4B942"/>
  </g>

</svg>
